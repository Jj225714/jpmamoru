# Loaded in nginx's http context. The upstream is fixed: no client-supplied target.
upstream aoweisi_bm_models {
    server bm.clawvp.com:443;
    keepalive 16;
}
limit_req_zone $binary_remote_addr zone=aoweisi_bm_requests:10m rate=6r/s;
limit_conn_zone $binary_remote_addr zone=aoweisi_bm_connections:10m;
