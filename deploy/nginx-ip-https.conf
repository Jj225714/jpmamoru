server {
    listen 80;
    listen [::]:80;
    server_name 103.79.187.126;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://103.79.187.126$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 103.79.187.126;
    ssl_certificate /etc/letsencrypt/live/infinite-canvas-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/infinite-canvas-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CanvasTLS:10m;
    root /opt/infinite-canvas/current;
    index index.html;

    include /etc/nginx/snippets/aoweisi-private-data.conf;
    include /etc/nginx/snippets/aoweisi-bm-locations.conf;
    include /etc/nginx/snippets/aoweisi-managed-locations.conf;

    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /workspace-transfer.html { add_header Cache-Control "no-store"; }
    location = /config.js {
        alias /etc/infinite-canvas/runtime-config.js;
        add_header Cache-Control "no-store";
    }
    location = /public-rules/catalog.json {
        alias /var/lib/aoweisi-public-rules/catalog.json;
        add_header Cache-Control "no-store";
        limit_except GET { deny all; }
    }
    location = /public-rules/catalog-visual-v2.json {
        alias /var/lib/aoweisi-public-rules/catalog-visual-v2.json;
        add_header Cache-Control "no-store";
        limit_except GET { deny all; }
    }
    location /public-rules/releases/ {
        alias /var/lib/aoweisi-public-rules/releases/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        limit_except GET { deny all; }
    }
    location = /public-rules/catalog-creative-v1.json {
        alias /var/lib/aoweisi-public-rules/catalog-creative-v1.json;
        add_header Cache-Control "no-store";
        limit_except GET { deny all; }
    }
    location /public-rules/ { return 404; }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
